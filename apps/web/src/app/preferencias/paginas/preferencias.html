@let p = atuais();

<nb-moldura-de-configuracoes titulo="Preferências">
  @if (erro(); as mensagem) {
  <nb-aviso tipo="perigo">{{ mensagem }}</nb-aviso>
  }

  <nb-cartao-de-secao titulo="Calendário">
    <nb-campo rotulo="Visão ao abrir">
      <select
        class="nb-entrada"
        (change)="alterar({ defaultView: $any($event.target).value })"
      >
        @for (opcao of visoes; track opcao.valor) {
        <option
          [value]="opcao.valor"
          [selected]="opcao.valor === p.defaultView"
        >
          {{ opcao.rotulo }}
        </option>
        }
      </select>
    </nb-campo>

    <nb-campo rotulo="A semana começa em">
      <select
        class="nb-entrada"
        (change)="alterarInicioDaSemana($any($event.target).value)"
      >
        @for (opcao of diasDaSemana; track opcao.valor) {
        <option
          [value]="opcao.valor"
          [selected]="opcao.valor === p.weekStartsOn"
        >
          {{ opcao.rotulo }}
        </option>
        }
      </select>
    </nb-campo>

    <label class="marcacao">
      <input
        class="nb-caixa"
        type="checkbox"
        [checked]="p.use24Hour"
        (change)="alterar({ use24Hour: !p.use24Hour })"
      />
      <span>Relógio de 24 horas</span>
    </label>
  </nb-cartao-de-secao>
</nb-moldura-de-configuracoes>
