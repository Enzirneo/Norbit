@let e = erros();

<nb-moldura titulo="Entrar" subtitulo="Suas órbitas estão esperando.">
  <form
    corpo
    [formGroup]="formulario"
    (ngSubmit)="enviar()"
    class="flex flex-col gap-5"
  >
    <nb-campo rotulo="E-mail" [erro]="e['email']">
      <input
        type="email"
        formControlName="email"
        autocomplete="email"
        class="nb-entrada"
        [attr.aria-invalid]="e['email'] ? 'true' : null"
      />
    </nb-campo>

    <nb-campo rotulo="Senha" [erro]="e['password']">
      <input
        type="password"
        formControlName="password"
        autocomplete="current-password"
        class="nb-entrada"
        [attr.aria-invalid]="e['password'] ? 'true' : null"
      />
    </nb-campo>

    @if (e['formulario']) {
    <p role="alert" class="text-sm text-danger">{{ e['formulario'] }}</p>
    }

    <button nb-botao type="submit" [ocupado]="enviando()">
      {{ enviando() ? 'Entrando' : 'Entrar' }}
    </button>
  </form>

  <span rodape>
    Não tem conta?
    <a routerLink="/criar-conta" class="text-accent hover:underline">
      Criar uma
    </a>
  </span>
</nb-moldura>
