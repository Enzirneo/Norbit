@let e = erros();

<nb-moldura titulo="Criar conta" subtitulo="Leva menos de um minuto.">
  <form
    corpo
    [formGroup]="formulario"
    (ngSubmit)="enviar()"
    class="flex flex-col gap-5"
  >
    <nb-campo rotulo="Como você quer ser chamado" [erro]="e['displayName']">
      <input
        type="text"
        formControlName="displayName"
        autocomplete="name"
        class="nb-entrada"
        [attr.aria-invalid]="e['displayName'] ? 'true' : null"
      />
    </nb-campo>

    <nb-campo
      rotulo="Handle"
      dica="Letras, números e sublinhado. É como as outras pessoas vão te encontrar."
      [erro]="e['handle']"
    >
      <input
        type="text"
        formControlName="handle"
        autocomplete="username"
        placeholder="enzo"
        class="nb-entrada"
        [attr.aria-invalid]="e['handle'] ? 'true' : null"
      />
    </nb-campo>

    <nb-campo rotulo="E-mail" [erro]="e['email']">
      <input
        type="email"
        formControlName="email"
        autocomplete="email"
        class="nb-entrada"
        [attr.aria-invalid]="e['email'] ? 'true' : null"
      />
    </nb-campo>

    <nb-campo
      rotulo="Senha"
      dica="Pelo menos 12 caracteres. Uma frase curta serve, e é melhor que símbolos."
      [erro]="e['password']"
    >
      <input
        type="password"
        formControlName="password"
        autocomplete="new-password"
        class="nb-entrada"
        [attr.aria-invalid]="e['password'] ? 'true' : null"
      />
    </nb-campo>

    @if (e['formulario']) {
    <p role="alert" class="text-sm text-danger">{{ e['formulario'] }}</p>
    }

    <button nb-botao type="submit" [ocupado]="enviando()">
      {{ enviando() ? 'Criando' : 'Criar conta' }}
    </button>
  </form>

  <span rodape>
    Já tem conta?
    <a routerLink="/entrar" class="text-accent hover:underline">Entrar</a>
  </span>
</nb-moldura>
